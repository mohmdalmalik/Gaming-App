# A quiet safety net: the fast suites (the rules, the generated hotels, the computer guests, quick chat, the
# profile, the avatars' catalogue and the achievements, the frame safety net, which sound each button makes, the corridors' flicker, the words that teach the
# game, what the public events may carry, Your record, the documents' facts, the engine's options for Co-op, and Co-op's
# per-player view, referee, seam, fairness, connection and server suites) run on every push and
# pull request, and a red cross on the commit says one of them failed. It only REPORTS. The live game is published straight from the main branch by GitHub Pages and
# does not wait for this, so a red run never blocks (or removes) a publish.
# See README > Publishing and rolling back.
#
# These suites import only src/, with no three.js and no browser, so tests/node_modules is never installed. The one
# install is for the Co-op suites that start the real server (protocol-check, restore-check, and the real-server part
# of connection-check): a step
# runs `npm ci --prefix server` first (server/package-lock.json), which installs the server's only package, ws 8.22.0
# (it has no dependencies of its own). (The browser suites need Chromium and take 5-15 minutes each; they are run by
# hand.)
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast-suites:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false        # every suite reports, even if another one failed
      matrix:
        suite: [rules-check, logic-check, bots-check, chat-check, profile-check, wardrobe-check, honours-check, crash-check, audio-buttons-check, audio-load-check, flicker-check, polish-check, howto-check, public-events-check, record-check, docs-check, strip-check, discard-clock-check, engine-options-check, view-check, referee-check, fairness-check, seam-check, connection-check, protocol-check, restore-check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the Co-op server's package (ws), once it has a lockfile
        if: hashFiles('server/package-lock.json') != ''
        run: npm ci --prefix server
      - name: Run ${{ matrix.suite }}
        run: node tests/${{ matrix.suite }}.mjs
