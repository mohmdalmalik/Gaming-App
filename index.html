<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141318">
<title>Gaming-App — Greybox</title>
<link rel="stylesheet" href="./styles.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div id="app">
    <div id="view"></div>

    <div id="hud" hidden>
      <div class="hud-top-left">
        <div id="room-name" class="pill">—</div>
        <div id="turn" class="pill small">Turn 1</div>
      </div>
      <div class="hud-top-right">
        <div id="action-points" class="pill">Action points: —</div>
      </div>
      <div class="hud-bottom-left">
        <button id="btn-end-turn" class="btn wide" type="button">End turn</button>
      </div>
      <div class="hud-bottom-right">
        <div class="rotate-group">
          <button id="btn-rotate-left" class="btn round" type="button" aria-label="Rotate view left">&#x21BA;</button>
          <button id="btn-rotate-right" class="btn round" type="button" aria-label="Rotate view right">&#x21BB;</button>
        </div>
        <button id="btn-map" class="btn round map" type="button" aria-label="Open map">&#x1F5FA;&#xFE0E;</button>
      </div>
      <div id="toast" class="toast" hidden></div>
    </div>

    <div id="map-overlay" class="overlay" hidden>
      <div class="map-panel">
        <div class="map-header">
          <span>Explored rooms</span>
          <button id="btn-map-close" class="btn round" type="button" aria-label="Close map">&#x2715;</button>
        </div>
        <canvas id="map-canvas"></canvas>
      </div>
    </div>

    <div id="start-overlay" class="overlay center">
      <div class="card">
        <h1>Gaming-App</h1>
        <p class="muted">Greybox prototype</p>
        <button id="btn-begin" class="btn primary big" type="button" disabled>Loading…</button>
      </div>
    </div>

    <div id="exit-overlay" class="overlay center" hidden>
      <div class="card">
        <h1>You found the exit</h1>
        <p id="exit-summary" class="muted"></p>
        <button id="btn-restart" class="btn primary big" type="button">Restart</button>
      </div>
    </div>

    <div id="error-overlay" class="overlay center" hidden>
      <div class="card">
        <h1>Could not start</h1>
        <p id="error-message" class="muted"></p>
      </div>
    </div>
  </div>

  <script type="module">
    import('./src/main.js').catch((err) => {
      console.error(err);
      const box = document.getElementById('error-overlay');
      const msg = document.getElementById('error-message');
      msg.textContent = 'The 3D engine could not be loaded. Check the internet connection and reload. (' + (err && err.message ? err.message : err) + ')';
      box.hidden = false;
      document.getElementById('start-overlay').hidden = true;
    });
  </script>
</body>
</html>
