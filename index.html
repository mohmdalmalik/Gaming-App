<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141318">
<title>Hotel Escape — Greybox</title>
<link rel="stylesheet" href="./styles.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div id="app">
    <div id="view"></div>

    <div id="possess-tint" class="possess-tint" hidden></div>

    <div id="hud" hidden>
      <!-- Top-left: where you are, and whether it's a safe zone. -->
      <div class="hud-top-left">
        <div id="room-name" class="place">—</div>
        <div id="safe-badge" class="safe-badge" hidden><span class="shield">&#x1F6E1;&#xFE0E;</span>Safe zone</div>
      </div>
      <!-- Top-centre: the guests, with clear current-turn and next-player indicators. -->
      <div class="hud-top-center">
        <div id="players-strip" class="players-strip"></div>
      </div>
      <div class="hud-top-right">
        <div id="round" class="round-label">Round 1</div>
      </div>

      <!-- Bottom bar: ONE flex/grid container so the player panel, the hand opener and the buttons
           share the width and can never overlap (they shrink or re-flow instead). -->
      <div class="hud-bottom">
        <!-- Left: the active player — portrait (normal / possessed), name, health, actions. -->
        <div class="hud-bottom-left">
          <div id="player-panel" class="player-panel">
            <div id="portrait-slot" class="portrait-slot"></div>
            <div class="player-meta">
              <div id="active-player" class="player-name">—</div>
              <div class="stat"><span class="stat-label">Health</span><div id="health" class="health" aria-label="Health"></div></div>
              <div class="stat"><span class="stat-label">Actions</span><div id="ap-pips" class="ap-pips" aria-hidden="true"></div><span id="action-points" class="ap-count">— / —</span></div>
              <button id="btn-private" class="private-link" type="button">&#x25B8; Private details</button>
            </div>
          </div>
        </div>

        <!-- Centre: the active player's hand (fanned backs + count). Tap to open. -->
        <div id="hand-strip" class="hand-strip" role="button" tabindex="0" aria-label="View hand">
          <div id="hand-backs" class="hand-backs"></div>
          <span class="hand-strip-label">View hand</span>
          <span id="hand-count" class="hand-count" aria-label="Cards in hand">0</span>
        </div>

        <!-- Right: camera controls (kept separate) above the turn actions. -->
        <div class="hud-bottom-right">
          <div class="control-row">
            <button id="btn-rotate-left" class="ctl round" type="button" aria-label="Rotate view left">&#x21BA;</button>
            <button id="btn-rotate-right" class="ctl round" type="button" aria-label="Rotate view right">&#x21BB;</button>
            <button id="btn-map" class="ctl map" type="button" aria-label="Open map"><span class="ico">&#x25A4;</span> Map</button>
          </div>
          <div class="action-row">
            <button id="btn-search" class="btn action" type="button"><span class="btn-main">Search</span><span id="search-sub" class="btn-sub">1 action</span></button>
            <button id="btn-trade" class="btn action" type="button" hidden><span class="btn-main">Trade</span><span class="btn-sub">Safe zone</span></button>
            <button id="btn-end-turn" class="btn primary end" type="button"><span class="btn-main">End turn &#x203A;</span><span id="end-sub" class="btn-sub">Next: —</span></button>
          </div>
        </div>
      </div>

      <div id="confirm-bar" class="confirm-bar" hidden>
        <span id="confirm-text">Move?</span>
        <button id="btn-confirm-move" class="btn primary" type="button">Move &#183; 1 AP</button>
        <button id="btn-confirm-cancel" class="btn" type="button">Cancel</button>
      </div>

      <div id="toast" class="toast" hidden></div>
    </div>

    <!-- Discard-down-to-the-hand-limit modal (shown at end of turn when over the limit) -->
    <div id="discard-overlay" class="overlay center" hidden>
      <div class="modal">
        <div class="modal-title">Hand is full</div>
        <div id="discard-sub" class="modal-sub"></div>
        <div id="discard-cards" class="cards"></div>
        <div class="modal-actions">
          <button id="btn-discard-done" class="btn primary" type="button" disabled>Keep these 6</button>
        </div>
      </div>
    </div>

    <!-- Hand: a collapsible bottom sheet that keeps the room in view above it -->
    <div id="hand-overlay" class="overlay sheet" hidden>
      <div class="panel sheet">
        <div class="panel-header">
          <span id="hand-title" class="panel-title">Hand</span>
          <span class="lock">&#x1F512; Private</span>
          <span class="spacer"></span>
          <button id="btn-hand-close" class="btn round" type="button" aria-label="Close">&#x2715;</button>
        </div>
        <div id="hand-banner" class="banner" hidden></div>
        <div class="hand-body">
          <div class="hand-cards-wrap"><div id="hand-cards" class="cards"></div></div>
          <div id="hand-detail" class="hand-detail"></div>
        </div>
        <div id="hand-note" class="panel-note"></div>
      </div>
    </div>

    <!-- Encounter modal -->
    <div id="encounter-overlay" class="overlay center" hidden>
      <div class="modal">
        <div id="encounter-title" class="modal-title">Encounter</div>
        <div id="encounter-body" class="modal-body"></div>
        <div id="encounter-actions" class="modal-actions"></div>
      </div>
    </div>

    <!-- Map -->
    <div id="map-overlay" class="overlay" hidden>
      <div class="map-panel">
        <div class="map-header">
          <span class="panel-title">Hotel floor plan</span>
          <button id="btn-map-close" class="btn round" type="button" aria-label="Close map">&#x2715;</button>
        </div>
        <canvas id="map-canvas"></canvas>
        <div class="map-legend">
          <span><span class="sw here"></span> You are here</span>
          <span><span class="sw searched"></span> Searched</span>
          <span><span class="sw frontier"></span> Unexplored door</span>
        </div>
      </div>
    </div>

    <!-- Overlays -->
    <div id="start-overlay" class="overlay center">
      <div class="card">
        <h1>Hotel Escape</h1>
        <p class="muted">Greybox prototype · 5 players, hot-seat</p>
        <button id="btn-begin" class="btn primary big" type="button" disabled>Loading…</button>
      </div>
    </div>

    <div id="end-overlay" class="overlay center" hidden>
      <div class="card">
        <h1 id="end-title">Game over</h1>
        <p id="end-summary" class="muted"></p>
        <button id="btn-restart" class="btn primary big" type="button">New game</button>
      </div>
    </div>

    <div id="error-overlay" class="overlay center" hidden>
      <div class="card">
        <h1>Could not start</h1>
        <p id="error-message" class="muted"></p>
      </div>
    </div>
  </div>

  <script type="module">
    setTimeout(() => {
      if (!document.getElementById('btn-begin').disabled) return;
      document.getElementById('error-message').textContent = 'Still loading the 3D engine — check the internet connection and reload the page.';
      document.getElementById('error-overlay').hidden = false;
      document.getElementById('start-overlay').hidden = true;
    }, 20000);
    import('./src/main.js').catch((err) => {
      console.error(err);
      const box = document.getElementById('error-overlay');
      document.getElementById('error-message').textContent = 'The 3D engine could not be loaded. Check the internet connection and reload. (' + (err && err.message ? err.message : err) + ')';
      box.hidden = false;
      document.getElementById('start-overlay').hidden = true;
    });
  </script>
</body>
</html>
