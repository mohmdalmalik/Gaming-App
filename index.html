<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141318">
<title>Hotel Escape — Greybox</title>
<link rel="stylesheet" href="./styles.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div id="app">
    <div id="view"></div>

    <div id="possess-tint" class="possess-tint" hidden></div>

    <div id="hud" hidden>
      <!-- Top: the other players, small and unobtrusive; the active one is highlighted. -->
      <div class="hud-top-center">
        <div id="players-strip" class="players-strip"></div>
      </div>
      <div class="hud-top-right">
        <div id="room-name" class="pill small">—</div>
        <div id="round" class="pill small">Round 1</div>
      </div>

      <!-- Bottom-left: the active player — portrait (normal / possessed), name, health, AP. -->
      <div class="hud-bottom-left">
        <div id="player-panel" class="player-panel">
          <div id="portrait-slot" class="portrait-slot"></div>
          <div class="player-meta">
            <div id="active-player" class="player-name">—</div>
            <div id="health" class="health" aria-label="Health"></div>
            <div id="action-points" class="ap-line">AP —</div>
          </div>
        </div>
      </div>

      <!-- Bottom-centre: the active player's hand, face down, with a live count. Tap to open. -->
      <div id="hand-strip" class="hand-strip" role="button" tabindex="0" aria-label="Open hand">
        <div id="hand-backs" class="hand-backs"></div>
        <div id="hand-count" class="hand-count" aria-label="Cards in hand">0</div>
      </div>

      <!-- Bottom-right: actions, then the view controls. -->
      <div class="hud-bottom-right">
        <div class="action-row">
          <button id="btn-search" class="btn" type="button">Search <span class="ap-cost">1</span></button>
          <button id="btn-end-turn" class="btn wide" type="button">End turn</button>
        </div>
        <div class="control-row">
          <button id="btn-rotate-left" class="btn round" type="button" aria-label="Rotate view left">&#x21BA;</button>
          <button id="btn-rotate-right" class="btn round" type="button" aria-label="Rotate view right">&#x21BB;</button>
          <button id="btn-map" class="btn round map" type="button" aria-label="Open map">&#x1F5FA;&#xFE0E;</button>
        </div>
      </div>

      <div id="confirm-bar" class="confirm-bar" hidden>
        <span id="confirm-text">Move?</span>
        <button id="btn-confirm-move" class="btn primary" type="button">Move · 1 AP</button>
        <button id="btn-confirm-cancel" class="btn" type="button">Cancel</button>
      </div>

      <div id="toast" class="toast" hidden></div>
    </div>

    <!-- Discard-down-to-the-hand-limit modal (shown at end of turn when over the limit) -->
    <div id="discard-overlay" class="overlay center" hidden>
      <div class="modal">
        <div class="modal-title">Hand is full</div>
        <div id="discard-sub" class="modal-sub"></div>
        <div id="discard-cards" class="cards"></div>
        <div class="modal-actions">
          <button id="btn-discard-done" class="btn primary" type="button" disabled>Keep these 6</button>
        </div>
      </div>
    </div>

    <!-- Hand panel -->
    <div id="hand-overlay" class="overlay" hidden>
      <div class="panel">
        <div class="panel-header">
          <span id="hand-title">Hand</span>
          <button id="btn-hand-close" class="btn round" type="button" aria-label="Close">&#x2715;</button>
        </div>
        <div id="hand-banner" class="banner" hidden></div>
        <div id="hand-cards" class="cards"></div>
        <div id="hand-note" class="panel-note"></div>
      </div>
    </div>

    <!-- Encounter modal -->
    <div id="encounter-overlay" class="overlay center" hidden>
      <div class="modal">
        <div id="encounter-title" class="modal-title">Encounter</div>
        <div id="encounter-body" class="modal-body"></div>
        <div id="encounter-actions" class="modal-actions"></div>
      </div>
    </div>

    <!-- Map -->
    <div id="map-overlay" class="overlay" hidden>
      <div class="map-panel">
        <div class="map-header">
          <span>Explored rooms</span>
          <button id="btn-map-close" class="btn round" type="button" aria-label="Close map">&#x2715;</button>
        </div>
        <canvas id="map-canvas"></canvas>
      </div>
    </div>

    <!-- Overlays -->
    <div id="start-overlay" class="overlay center">
      <div class="card">
        <h1>Hotel Escape</h1>
        <p class="muted">Greybox prototype · 5 players, hot-seat</p>
        <button id="btn-begin" class="btn primary big" type="button" disabled>Loading…</button>
      </div>
    </div>

    <div id="end-overlay" class="overlay center" hidden>
      <div class="card">
        <h1 id="end-title">Game over</h1>
        <p id="end-summary" class="muted"></p>
        <button id="btn-restart" class="btn primary big" type="button">New game</button>
      </div>
    </div>

    <div id="error-overlay" class="overlay center" hidden>
      <div class="card">
        <h1>Could not start</h1>
        <p id="error-message" class="muted"></p>
      </div>
    </div>
  </div>

  <script type="module">
    setTimeout(() => {
      if (!document.getElementById('btn-begin').disabled) return;
      document.getElementById('error-message').textContent = 'Still loading the 3D engine — check the internet connection and reload the page.';
      document.getElementById('error-overlay').hidden = false;
      document.getElementById('start-overlay').hidden = true;
    }, 20000);
    import('./src/main.js').catch((err) => {
      console.error(err);
      const box = document.getElementById('error-overlay');
      document.getElementById('error-message').textContent = 'The 3D engine could not be loaded. Check the internet connection and reload. (' + (err && err.message ? err.message : err) + ')';
      box.hidden = false;
      document.getElementById('start-overlay').hidden = true;
    });
  </script>
</body>
</html>
