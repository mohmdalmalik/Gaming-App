<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>glb preview</title>
<style>html,body{margin:0;height:100%;background:#2a2118;overflow:hidden}</style>
<style>html.clear,html.clear body{background:transparent}</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
} }
</script></head><body>
<script type="module">
// Generic character previewer. Mimics the game: Neutral tone mapping, hemisphere + warm point light,
// PBR materials converted to matte Lambert (same as src/render/characterView.js).
// possessed=1: the possessed look (red eyes) from the game's own module, so the portrait and the game agree.
// bg=none: a transparent backdrop, no floor (portrait.mjs paints the possessed plate behind the guest afterwards);
// bg=possessed: the private plum-crimson plate (vertical gradient) for viewing; bg=<hex>: a flat colour.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { createPossessedEyes, POSSESSED_COLORS } from '../../src/render/possessedLook.js';
const q = new URLSearchParams(location.search);
const CLEAR = q.get('bg') === 'none';
if (CLEAR) document.documentElement.classList.add('clear');
const src = q.get('glb') || '/assets/characters/victor.glb';
const view = q.get('view') || 'game';       // front | tq | side | back | game | gamescale
const clipName = q.get('clip') || 'Idle';
const t = parseFloat(q.get('t') || '0');    // seconds into the clip to freeze at (0 = start; play if 'play')
const yaw = parseFloat(q.get('yaw') || '0');  // model rotation about Y in degrees (turntable)
const dist = parseFloat(q.get('dist') || '0');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: CLEAR });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 1.0;
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const isPortrait = view === 'front' || view === 'tq' || view === 'side' || view === 'back' || view === 'body' || view === 'face' || view === 'elev' || view === 'elev30' || view === 'shoe' || view === 'shoeside' || view === 'hips';
scene.background = new THREE.Color(isPortrait ? 0x1a1d27 : 0x8a6a3a);
const cam = new THREE.PerspectiveCamera(isPortrait ? 28 : 42, innerWidth / innerHeight, 0.1, 100);

// Lighting close to the hall: hemisphere (sky lerped to a warm mood) + a warm point light overhead.
const NEUTRAL = (['body', 'face', 'elev', 'elev30', 'shoe', 'shoeside', 'hips'].includes(q.get('view'))) && q.get('light') !== 'game';
const hemi = new THREE.HemisphereLight(new THREE.Color('#ffffff').lerp(new THREE.Color('#ffd9a8'), 0.5), new THREE.Color('#3a3438'), 0.6);
scene.add(hemi);
// Neutral = albedo-faithful: a front-facing Lambert surface renders at about its base colour (Lambert divides by pi)
  if (NEUTRAL) { hemi.color.set('#ffffff'); hemi.groundColor.set('#9a9a9a'); hemi.intensity = 1.5; const dl = new THREE.DirectionalLight('#ffffff', 2.3); dl.position.set(q.get('key') === 'left' ? -1.5 : 1.5, 3, 4); scene.add(dl); }   // key=left: key light from the viewer's left (the guest sheets' studio key)
const pt = new THREE.PointLight(new THREE.Color('#ffd9a8'), 22, 9, 2); pt.position.set(1.2, 2.6, 1.6); if (!NEUTRAL) scene.add(pt);
const pt2 = new THREE.PointLight(new THREE.Color('#ffd9a8'), 10, 9, 2); pt2.position.set(-2.0, 2.4, -1.0); if (!NEUTRAL) scene.add(pt2);
if (!isPortrait && !CLEAR) {   // (bg=none: no floor either — everything behind the guest is left to the caller)
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), new THREE.MeshLambertMaterial({ color: 0x8a5a2e }));
  floor.rotation.x = -Math.PI / 2; scene.add(floor);
  scene.add(new THREE.GridHelper(8, 16, 0x6a4626, 0x5a3c22));
}

function flatten(src) {
  const m = new THREE.MeshLambertMaterial({ color: src.color ? src.color.clone() : new THREE.Color('#cccccc') });
  if (src.map) m.map = src.map;
  if (src.emissive) m.emissive = src.emissive.clone();
  if (src.transparent) { m.transparent = true; m.opacity = src.opacity; }
  if (src.side !== undefined) m.side = src.side;
  if (src.vertexColors) m.vertexColors = true;   // baked shading (glTF COLOR_0), same as the game loader
  m.name = src.name; return m;
}

let mixer = null, action = null; const clock = new THREE.Clock();
new GLTFLoader().load(src, (gltf) => {
  const root = gltf.scene; root.rotation.y = THREE.MathUtils.degToRad(yaw); scene.add(root);
  let meshes = 0, tris = 0; const mats = new Map();
  root.traverse(o => {
    if (!o.isMesh) return;
    meshes++; o.frustumCulled = false;
    const g = o.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
    o.material = Array.isArray(o.material) ? o.material.map(flatten) : flatten(o.material);
    for (const m of (Array.isArray(o.material) ? o.material : [o.material])) mats.set(m.name, '#' + m.color.getHexString());
  });
  const eyes = createPossessedEyes(root); if (q.get('possessed') === '1') eyes.set(true);
  window.__eyes = eyes;   // (debug: eyes.materials[i].userData.possessedUniforms for tuning the look)
  const box = new THREE.Box3().setFromObject(root); const size = box.getSize(new THREE.Vector3());
  const h = Math.max(0.5, size.y), cy = box.min.y + h * 0.5;
  // Camera placement per view
  const d = dist || (isPortrait ? h * 2.1 : 6.5);
  if (view === 'front') { cam.position.set(0, box.min.y + h * 0.78, d * 0.62); cam.lookAt(0, box.min.y + h * 0.74, 0); cam.fov = 26; }
  else if (view === 'tq') { cam.position.set(d * 0.42, box.min.y + h * 0.82, d * 0.52); cam.lookAt(0, box.min.y + h * 0.72, 0); cam.fov = 26; }
  else if (view === 'side') { cam.position.set(d * 0.7, box.min.y + h * 0.55, 0.0); cam.lookAt(0, cy, 0); cam.fov = 30; }
  else if (view === 'back') { cam.position.set(0, box.min.y + h * 0.8, -d * 0.62); cam.lookAt(0, box.min.y + h * 0.74, 0); cam.fov = 26; }
  else if (view === 'body') {       // level full-body view like a turnaround sheet (use yaw= for 3/4, side, back)
    scene.background = new THREE.Color('#d8d8d8');
    cam.position.set(0, box.min.y + h * 0.52, 15.0); cam.lookAt(0, box.min.y + h * 0.50, 0); cam.fov = 7.6;   // long lens: sheet-like, little perspective
  }
  else if (view === 'face') {       // level face close-up like the sheet's face panels (use yaw=)
    scene.background = new THREE.Color('#d8d8d8');
    cam.position.set(0, box.min.y + h * 0.83, 4.4); cam.lookAt(0, box.min.y + h * 0.81, 0); cam.fov = 10.5;   // whole hair + headroom
  }
  else if (view === 'elev') {       // elevated head close-up: the game's pitch (56 deg), close, on the crown (use yaw=)
    scene.background = new THREE.Color('#d8d8d8');
    const pitch = THREE.MathUtils.degToRad(56), D = 3.2, ty = box.min.y + h * 0.90;
    cam.position.set(0, ty + Math.sin(pitch) * D, Math.cos(pitch) * D); cam.lookAt(0, ty, 0); cam.fov = 12;
  }
  else if (view === 'elev30') {     // the sheet's elevated panel: gentle ~30 deg view of the whole figure (use yaw=)
    scene.background = new THREE.Color('#d8d8d8');
    const pitch = THREE.MathUtils.degToRad(30), D = 9.0, ty = box.min.y + h * 0.50;
    cam.position.set(0, ty + Math.sin(pitch) * D, Math.cos(pitch) * D); cam.lookAt(0, ty, 0); cam.fov = 13;
  }
  else if (view === 'shoe') {       // shoe close-up: low camera, slightly above floor level, from the front-three-quarter (use yaw=)
    scene.background = new THREE.Color('#d8d8d8');
    cam.position.set(0, box.min.y + 0.45, 3.2); cam.lookAt(0, box.min.y + 0.10, 0); cam.fov = 11;
  }
  else if (view === 'shoeside') {   // large shoe close-up: level camera at shoe height (use yaw=90 for the profile)
    scene.background = new THREE.Color('#d8d8d8');
    cam.position.set(0, box.min.y + 0.22, 3.0); cam.lookAt(0, box.min.y + 0.10, 0); cam.fov = 11;
  }
  else if (view === 'hips') {       // waist-to-knee close-up, level camera (use yaw=)
    scene.background = new THREE.Color('#d8d8d8');
    cam.position.set(0, box.min.y + 0.62, 3.6); cam.lookAt(0, box.min.y + 0.58, 0); cam.fov = 10;
  }
  else if (view === 'portrait') {   // tight bust for the interface portrait (charcoal plate)
    scene.background = new THREE.Color('#171b27');
    cam.position.set(0.05, box.min.y + h * 0.86, 2.15); cam.lookAt(0, box.min.y + h * 0.80, 0); cam.fov = 24;
  }
  else if (view === 'gamescale') {  // true in-game size: pitch 56°, distance 13, fov 42 (config.js)
    const pitch = THREE.MathUtils.degToRad(56), D = 13;
    cam.position.set(0, Math.sin(pitch) * D, Math.cos(pitch) * D); cam.lookAt(0, 0, 0); cam.fov = 42;
  } else {                            // 'game': same pitch, closer, for inspection
    const pitch = THREE.MathUtils.degToRad(56), D = d;
    cam.position.set(0, Math.sin(pitch) * D, Math.cos(pitch) * D); cam.lookAt(0, 0.0, 0); cam.fov = 42;
  }
  if (CLEAR) scene.background = null;
  else if (q.get('bg') === 'possessed') {   // the private possessed plate: plum-crimson, lighter at the top
    const c = document.createElement('canvas'); c.width = 4; c.height = 256;
    const g2 = c.getContext('2d'), gr = g2.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, POSSESSED_COLORS.plateTop); gr.addColorStop(1, POSSESSED_COLORS.plateBottom);
    g2.fillStyle = gr; g2.fillRect(0, 0, 4, 256);
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; scene.background = tex;
  }
  else if (q.get('bg')) scene.background = new THREE.Color('#' + q.get('bg'));   // e.g. bg=7a716b: the guest sheets' grey
  cam.updateProjectionMatrix();
  mixer = new THREE.AnimationMixer(root);
  const clip = gltf.animations.find(a => a.name === clipName) || gltf.animations[0];
  if (clip) { action = mixer.clipAction(clip); action.play(); if (q.get('t') !== 'play') { mixer.setTime(t); } }
  // Optional: project model-space points (x,y,z;x,y,z ...) to CSS pixels — used to place the
  // "possessed" eye effect on the portrait exactly over the rendered eye.
  const proj = [];
  root.updateMatrixWorld(true); cam.updateMatrixWorld(true);   // project() needs current matrices
  // points are given in the model's REST pose: carry them with the head bone into the current pose (the portrait
  // freezes the Idle clip, which tilts the head a little), via the head's inverse bind matrix
  let headBone = null, headInv = null;
  root.traverse(o => { if (!headBone && o.isSkinnedMesh) { const i = o.skeleton.bones.findIndex(b => b.name === 'head'); if (i >= 0) { headBone = o.skeleton.bones[i]; headInv = o.skeleton.boneInverses[i]; } } });
  for (const p of (q.get('points') || '').split(';').filter(Boolean)) {
    const [x, y, z] = p.split(',').map(Number);
    const w = new THREE.Vector3(x, y, z);
    if (headBone && q.get('follow') !== '0') w.applyMatrix4(headInv).applyMatrix4(headBone.matrixWorld); else root.localToWorld(w);
    w.project(cam);
    proj.push({ x: +((w.x + 1) / 2 * innerWidth).toFixed(1), y: +((1 - w.y) / 2 * innerHeight).toFixed(1) });
  }
  window.__info = { ok: true, clips: gltf.animations.map(a => ({ name: a.name, duration: +a.duration.toFixed(3) })), meshes, tris: Math.round(tris),
    height: +size.y.toFixed(3), width: +size.x.toFixed(3), depth: +size.z.toFixed(3), minY: +box.min.y.toFixed(3), materials: Object.fromEntries(mats), points: proj,
    possessedEyes: { available: eyes.available, on: eyes.on } };
}, undefined, (err) => { window.__info = { ok: false, error: String(err && err.message || err) }; });

renderer.setAnimationLoop(() => { if (mixer && q.get('t') === 'play') mixer.update(clock.getDelta()); renderer.render(scene, cam); });
</script></body></html>
