<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>glb preview</title>
<style>html,body{margin:0;height:100%;background:#20242e;overflow:hidden}</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
} }
</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x20242e);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
cam.position.set(2.4, 1.9, 3.2); cam.lookAt(0, 0.8, 0);
scene.add(new THREE.HemisphereLight(0xffffff, 0x33303a, 1.1));
const key = new THREE.DirectionalLight(0xfff2d8, 1.5); key.position.set(3, 5, 2); scene.add(key);
scene.add(new THREE.GridHelper(6, 12, 0x666666, 0x3a3a44));

let mixer = null; const clock = new THREE.Clock();
new GLTFLoader().load('./test_guest.glb', (gltf) => {
  scene.add(gltf.scene);
  let meshes = 0, tris = 0;
  gltf.scene.traverse(o => { if (o.isMesh) { meshes++; const g = o.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3; } });
  if (gltf.animations.length) { mixer = new THREE.AnimationMixer(gltf.scene); mixer.clipAction(gltf.animations[0]).play(); }
  window.__loaded = { ok: true, clips: gltf.animations.length, clipNames: gltf.animations.map(a => a.name), meshes, tris: Math.round(tris) };
}, undefined, (err) => { window.__loaded = { ok: false, error: String(err && err.message || err) }; });

renderer.setAnimationLoop(() => { if (mixer) mixer.update(clock.getDelta()); renderer.render(scene, cam); });
</script>
</body></html>
