<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>victor preview</title>
<style>html,body{margin:0;height:100%;background:#2a2118;overflow:hidden}</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
} }
</script></head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search);
const clipName = q.get('clip') || 'Idle';
const view = q.get('view') || 'game';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(view === 'front' ? 0x20242e : 0x8a6a3a);
const cam = new THREE.PerspectiveCamera(view === 'front' ? 30 : 42, innerWidth / innerHeight, 0.1, 100);
if (view === 'front') { cam.position.set(0, 1.05, 3.1); cam.lookAt(0, 1.0, 0); }
else { cam.position.set(2.9, 3.6, 3.4); cam.lookAt(0, 0.8, 0); }   // elevated 3/4, like the game

scene.add(new THREE.HemisphereLight(0xffffff, 0x3a2f24, 1.15));
const key = new THREE.DirectionalLight(0xfff0d6, 1.7); key.position.set(4, 7, 3); scene.add(key);
if (view !== 'front') scene.add(new THREE.GridHelper(6, 12, 0x6a5636, 0x4a3c26));

let mixer = null; const clock = new THREE.Clock();
new GLTFLoader().load('/assets/characters/victor.glb', (gltf) => {
  const root = gltf.scene; scene.add(root);
  let meshes = 0, tris = 0;
  root.traverse(o => { if (o.isMesh) { meshes++; const g = o.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3; } });
  const box = new THREE.Box3().setFromObject(root); const size = box.getSize(new THREE.Vector3());
  mixer = new THREE.AnimationMixer(root);
  const clip = gltf.animations.find(a => a.name === clipName) || gltf.animations[0];
  if (clip) mixer.clipAction(clip).play();
  window.__info = { ok: true, clips: gltf.animations.map(a => a.name), meshes, tris: Math.round(tris),
    height: +size.y.toFixed(3), width: +size.x.toFixed(3), minY: +box.min.y.toFixed(3) };
}, undefined, (err) => { window.__info = { ok: false, error: String(err && err.message || err) }; });

renderer.setAnimationLoop(() => { if (mixer) mixer.update(clock.getDelta()); renderer.render(scene, cam); });
</script></body></html>
