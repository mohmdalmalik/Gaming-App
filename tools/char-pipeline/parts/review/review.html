<script type="module">
// The parts review page (driven by tools/char-pipeline/parts/review.mjs; never part of the game).
//   window.review.sheet({ parts, body, worn, item, look, shipped, footer })  -> PNG data URL of the 2400 x 1600 sheet
//   window.review.redeye({ parts, body, withKeys, withoutKeys, hideFace })   -> the 24-view red-eye result
//   window.review.mirror({ parts, body, worn, shipped })                     -> side-by-side sheet + pixel differences
// It renders with the game's own lights, tone mapping, rim shader and possessed eyes (src/render/possessedLook.js);
// the guest is assembled by assemble-dev.js until the game's src/render/avatarParts.js exists (contract 9.2).
import * as THREE from 'three';
import { createLibrary, resolveKeys, assembleDev, loadShipped } from './assemble-dev.js';
import { createPossessedEyes, POSSESSED_COLORS } from '../../../../src/render/possessedLook.js';

const W = 400, HT = 516, SS = 2;                     // tile size on the sheet; render supersampling
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 1.0;
renderer.setPixelRatio(1); renderer.setSize(W * SS, HT * SS);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(30, W / HT, 0.05, 200);

// ---- light setups ------------------------------------------------------------------------------------------------
const GAME_RIM = { color: '#ffe2b8', rim: 0.42, fill: 0.1 };          // src/render/avatar.js
const LOBBY_RIM = { color: '#ffd9a8', rim: 0.55, fill: 0.08 };        // src/menu/lobbyScene.js
const groups = {};
function group(name, build) { const g = new THREE.Group(); g.name = name; build(g); g.visible = false; scene.add(g); groups[name] = g; }
group('studio', g => {                     // the pipeline's neutral studio (preview_glb.html): grey, hemisphere + key
  g.add(new THREE.HemisphereLight('#ffffff', '#9a9a9a', 1.5));
  const dl = new THREE.DirectionalLight('#ffffff', 2.3); dl.position.set(-1.5, 3, 4); g.add(dl);
});
group('lobby', g => {                      // the menu lobby's own lights round the player's spot by the lift (lobbyLayout.js)
  const P = [2.3, -4.55];
  for (const [x, y, z, c, i, d, k] of [[1.55, 4.0, -0.9, '#ffc98a', 15, 16, 1.6], [5.3, 4.05, -0.2, '#ffc98a', 14, 16, 1.6], [1.1, 1.5, -3.7, '#ffb766', 3.2, 6, 1.6],
                                         [5.6, 1.45, -3.45, '#ffb766', 5, 7, 1.6], [-3.55, 1.45, -2.4, '#ffb766', 4, 7, 1.6]]) {
    const l = new THREE.PointLight(c, i, d, k); l.position.set(x - P[0], y, z - P[1]); g.add(l);
  }
  g.add(new THREE.HemisphereLight('#ffdcb0', '#2a1a12', 0.34));
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(14, 6), new THREE.MeshLambertMaterial({ color: 0x4a2c1c })); wall.position.set(0, 3, -1.35); g.add(wall);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), new THREE.MeshLambertMaterial({ color: 0x3a2418 })); floor.rotation.x = -Math.PI / 2; g.add(floor);
});
// a room lit as src/render/mood.js lights it: the hemisphere (0.6 x the mood's ambient, the mood colour halfway to
// white) and the room's light 2.4 m over its centre (mood intensity x 22, reach 8.5 m, decay 2); the guest stands
// 1.3 m off the centre. src/data/hotel.js moods: WARM and DARK.
const MOODS = { warm: { color: '#ffd8a8', intensity: 1.1, ambient: 0.85 }, dark: { color: '#b8c2d0', intensity: 0.45, ambient: 0.32 } };
for (const [name, M] of Object.entries(MOODS)) group(name, g => {
  g.add(new THREE.HemisphereLight(new THREE.Color(M.color).lerp(new THREE.Color('#ffffff'), 0.5), new THREE.Color('#3a3438'), 0.6 * M.ambient));
  const l = new THREE.PointLight(M.color, M.intensity * 22, 8.5, 2); l.position.set(-1.0, 2.4, -0.8); g.add(l);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshLambertMaterial({ color: 0x5a5250 })); floor.rotation.x = -Math.PI / 2; g.add(floor);
});
group('portrait', g => {                   // src/render/avatarPortrait.js
  g.add(new THREE.HemisphereLight(new THREE.Color('#ffffff').lerp(new THREE.Color('#ffd9a8'), 0.5), new THREE.Color('#3a3438'), 0.6));
  const key = new THREE.PointLight(new THREE.Color('#ffd9a8'), 22, 9, 2); key.position.set(1.2, 2.6, 1.6); g.add(key);
  const back = new THREE.PointLight(new THREE.Color('#ffd9a8'), 10, 9, 2); back.position.set(-2.0, 2.4, -1.0); g.add(back);
});
const BG = { studio: '#7b716a', lobby: '#0c0908', warm: '#141318', dark: '#141318', portrait: null };
function useLight(name) { for (const [k, g] of Object.entries(groups)) g.visible = k === name; scene.background = BG[name] ? new THREE.Color(BG[name]) : null; }

// ---- guests ------------------------------------------------------------------------------------------------------
const libs = new Map();
const lib = parts => { if (!libs.has(parts)) libs.set(parts, createLibrary(parts)); return libs.get(parts); };
async function guestFrom({ parts, body, keys, glasses, rim, omit }) {
  const G = await assembleDev(lib(parts), body, keys, { rim, glasses, omit });
  G.eyesSwitch = createPossessedEyes(G.root);
  G.mixer = new THREE.AnimationMixer(G.root);
  return G;
}
async function shippedFrom(url, { rim, glasses }) {
  const G = await loadShipped(url, { rim, glasses });
  G.eyesSwitch = createPossessedEyes(G.root); G.mixer = new THREE.AnimationMixer(G.root);
  return G;
}
function pose(G, clipName, frac) {
  G.mixer.stopAllAction();
  const clip = G.clips.find(c => c.name === clipName) || G.clips[0];
  const a = G.mixer.clipAction(clip); a.play(); G.mixer.setTime(frac * clip.duration);
  G.root.updateMatrixWorld(true);
}
let shown = null;
function show(G, { yaw = 0, at = [0, 0, 0] } = {}) {
  if (shown && shown !== G.root) scene.remove(shown);
  if (G.root.parent !== scene) scene.add(G.root);
  shown = G.root; G.root.rotation.set(0, THREE.MathUtils.degToRad(yaw), 0); G.root.position.set(...at); G.root.updateMatrixWorld(true);
}
function strideExtreme(G) {      // the walk phase with the feet furthest apart
  let best = 0, bf = 0; const a = new THREE.Vector3(), b = new THREE.Vector3();
  for (let i = 0; i < 32; i++) {
    pose(G, 'Walk', i / 32);
    G.root.getObjectByName('footL').getWorldPosition(a); G.root.getObjectByName('footR').getWorldPosition(b);   // (GLTFLoader drops the dots)
    const d = Math.abs(a.z - b.z); if (d > best) { best = d; bf = i / 32; }
  }
  return bf;
}

// ---- cameras -----------------------------------------------------------------------------------------------------
function look(from, to, fov, aspect = W / HT) { cam.clearViewOffset(); cam.fov = fov; cam.aspect = aspect; cam.position.set(...from); cam.lookAt(...to); cam.updateProjectionMatrix(); }
function closeup(area, eye) {
  const ey = eye ? eye[1] : 1.37;
  return { head: [[0, ey + 0.10, 1.85], [0, ey + 0.02, 0], 22], torso: [[0, 1.0, 2.5], [0, 0.93, 0], 25], hands: [[0.7, 0.78, 1.5], [0.33, 0.62, 0], 20],
           legs: [[0.6, 0.5, 2.5], [0, 0.42, 0], 24], feet: [[0.5, 0.35, 1.6], [0, 0.14, 0], 22] }[area];
}
// the game camera (src/config.js): fov 42, pitch 44, distance 16, the view 45 degrees off the room's axes, snapping by
// 90; drawn at TRUE size for 1180 x 820 CSS px at dpr 2 (a 2360 x 1640 frame), only the crop round the guest. At that
// size a guest is about 200 device px tall, so the tile shows it x2 (x3, the contract's figure, would cut it off)
function gameCrop(G, turn, { w = 200, h = 258 } = {}) {
  cam.clearViewOffset();
  const FW = 2360, FH = 1640, pitch = THREE.MathUtils.degToRad(44), az = THREE.MathUtils.degToRad(45 + 90 * turn);
  // the game aims 1.2 m past the guest toward the camera (config.camera.lookAhead): the guest is that much further away
  const focus = new THREE.Vector3(G.root.position.x + 1.2 * Math.sin(az), 0.0, G.root.position.z + 1.2 * Math.cos(az));
  cam.fov = 42; cam.aspect = FW / FH;
  cam.position.set(focus.x + 16 * Math.cos(pitch) * Math.sin(az), 16 * Math.sin(pitch), focus.z + 16 * Math.cos(pitch) * Math.cos(az));
  cam.lookAt(focus); cam.updateProjectionMatrix(); cam.updateMatrixWorld(true);
  const c = new THREE.Vector3(G.root.position.x, 0.86, G.root.position.z).project(cam);
  const px = (c.x * 0.5 + 0.5) * FW, py = (-c.y * 0.5 + 0.5) * FH;
  cam.setViewOffset(FW, FH, Math.round(px - w / 2), Math.round(py - h / 2), w, h); cam.updateProjectionMatrix();
  return { w, h };
}

// ---- drawing into tiles ------------------------------------------------------------------------------------------
function renderToCanvas(w, h) {
  renderer.setSize(w, h); renderer.render(scene, cam);
  const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(renderer.domElement, 0, 0); return c;
}
function tileFull() { return renderToCanvas(W * SS, HT * SS); }
function tileGame(G, turn) { const { w, h } = gameCrop(G, turn); return { c: renderToCanvas(w, h), nearest: true }; }
function label(ctx, x, y, text, sub) {
  ctx.fillStyle = 'rgba(12,9,8,0.72)'; ctx.fillRect(x, y, W, sub ? 40 : 24);
  ctx.fillStyle = '#efe3cc'; ctx.font = '15px Georgia, serif'; ctx.fillText(text, x + 8, y + 17);
  if (sub) { ctx.fillStyle = '#c9a25a'; ctx.font = '12px Georgia, serif'; ctx.fillText(sub, x + 8, y + 34); }
}
function drawTile(ctx, i, j, t, text, sub) {
  const x = j * W, y = i * HT, c = t.c || t;
  ctx.imageSmoothingEnabled = !t.nearest; ctx.imageSmoothingQuality = 'high';
  if (t.nearest) { const s = Math.min(W / c.width, HT / c.height); const dw = c.width * Math.floor(s), dh = c.height * Math.floor(s);
    ctx.fillStyle = '#141318'; ctx.fillRect(x, y, W, HT); ctx.drawImage(c, x + (W - dw) / 2, y + (HT - dh) / 2, dw, dh); }
  else ctx.drawImage(c, x, y, W, HT);
  label(ctx, x, y, text, sub);
  ctx.strokeStyle = '#2a1e18'; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, W - 2, HT - 2);
}

// a runtime-style portrait (src/render/avatarPortrait.js framing and lights; the game's own code takes over when it
// draws part-built avatars): fov 24, the model turned 14 degrees, Idle at 0.4 s, eyes 37 % down, 3.5 eye gaps wide
function portrait(G, eye, possessed) {
  useLight('portrait'); show(G, { yaw: 14 }); pose(G, 'Idle', 0.4 / 3.0); G.eyesSwitch.set(possessed);
  const gap = 0.069 * 2, wv = gap * 3.5, hv = wv * 4 / 3, dist = 2.15;
  const ey = eye ? eye[1] : 1.37, ez = eye ? eye[2] : 0.2;
  cam.clearViewOffset(); cam.aspect = 3 / 4; cam.fov = THREE.MathUtils.radToDeg(2 * Math.atan(hv / 2 / dist));
  cam.position.set(0.05, ey - hv * (0.5 - 0.37), ez + dist); cam.lookAt(0, ey - hv * (0.5 - 0.37), ez); cam.updateProjectionMatrix();
  const c = renderToCanvas(384, 512); const o = document.createElement('canvas'); o.width = 384; o.height = 512; const x = o.getContext('2d');
  if (possessed) { const gr = x.createLinearGradient(0, 0, 0, 512); gr.addColorStop(0, POSSESSED_COLORS.plateTop); gr.addColorStop(1, POSSESSED_COLORS.plateBottom); x.fillStyle = gr; }
  else x.fillStyle = '#171b27';
  x.fillRect(0, 0, 384, 512); x.drawImage(c, 0, 0); G.eyesSwitch.set(false);
  return o;
}

async function sheet(o) {
  const out = document.createElement('canvas'); out.width = 6 * W; out.height = 1600; const ctx = out.getContext('2d');
  ctx.fillStyle = '#0c0908'; ctx.fillRect(0, 0, out.width, out.height);
  const man = await lib(o.parts).manifest();
  const keys = o.keys || resolveKeys(man, o.body, o.worn);
  const eye = (man.parts[`${o.body}/${keys.find(k => k.startsWith('face_'))}`] || {}).eyeCentre || man.bodies[o.body].eyeCentre;
  const studio = await guestFrom({ parts: o.parts, body: o.body, keys, glasses: o.glasses, rim: null });
  const lobbyG = await guestFrom({ parts: o.parts, body: o.body, keys, glasses: o.glasses, rim: LOBBY_RIM });
  const gameG = await guestFrom({ parts: o.parts, body: o.body, keys, glasses: o.glasses, rim: GAME_RIM });
  const old = o.shipped ? await shippedFrom(o.shipped, { rim: LOBBY_RIM, glasses: o.glasses }) : null;
  const area = o.area || 'head';
  // row A: studio
  useLight('studio'); pose(studio, 'Idle', 0);
  const full = [[0, 0.86, 7.2], [0, 0.84, 0], 15];
  [[0, 'front'], [30, 'three-quarter (30)'], [90, 'side (90)'], [180, 'back (180)']].forEach(([yaw, t], j) => {
    show(studio, { yaw }); look(...full); drawTile(ctx, 0, j, tileFull(), t);
  });
  const cu = closeup(area, eye);
  show(studio, { yaw: 0 }); look(...cu); drawTile(ctx, 0, 4, tileFull(), `close-up front (${area})`);
  show(studio, { yaw: 30 }); look(...cu); drawTile(ctx, 0, 5, tileFull(), `close-up three-quarter (${area})`);
  // row B: lobby light
  useLight('lobby'); pose(lobbyG, 'Idle', 0);
  const ward = [[-0.3, 1.41, 2.4], [0, 0.86, 0], 46];
  show(lobbyG); look(...ward); drawTile(ctx, 1, 0, tileFull(), 'lobby, wardrobe camera', `${keys.length + 1} files, ${lobbyG.stats.drawCalls} draw calls, ${lobbyG.stats.tris} tris`);
  if (old) { pose(old, 'Idle', 0); show(old); look(...ward); drawTile(ctx, 1, 1, tileFull(), `today's ${o.lookName || 'guest'} (shipped GLB)`, `${old.stats.drawCalls} draw calls, ${old.stats.tris} tris`); }
  show(lobbyG); look(...cu); drawTile(ctx, 1, 2, tileFull(), 'lobby close-up');
  if (old) { show(old); look(...closeup(area, o.shippedEye || eye)); drawTile(ctx, 1, 3, tileFull(), `today's ${o.lookName || 'guest'} close-up`); }
  drawTile(ctx, 1, 4, portrait(studio, eye, false), 'portrait', 'runtime framing (dev)');
  drawTile(ctx, 1, 5, portrait(studio, eye, true), 'portrait, possessed', 'runtime framing (dev)');
  // row C: the game camera at true size, x3
  useLight('warm'); show(gameG, { yaw: 0, at: [1.0, 0, 0.8] }); pose(gameG, 'Idle', 0);
  for (let t = 0; t < 4; t++) drawTile(ctx, 2, t, tileGame(gameG, t), `game camera, turn ${t + 1}`, 'warm room light, true pixels x2');
  useLight('dark'); const sf = strideExtreme(gameG); pose(gameG, 'Walk', sf);
  drawTile(ctx, 2, 4, tileGame(gameG, 0), 'walking, stride extreme', `DARK room light (Walk ${sf.toFixed(2)})`);
  pose(gameG, 'Idle', 0); gameG.eyesSwitch.set(true);
  drawTile(ctx, 2, 5, tileGame(gameG, 0), 'red eyes on', 'DARK room light'); gameG.eyesSwitch.set(false);
  // footer
  ctx.fillStyle = '#16100d'; ctx.fillRect(0, 3 * HT, out.width, out.height - 3 * HT);
  ctx.fillStyle = '#efe3cc'; ctx.font = '14px Georgia, serif';
  (o.footer || []).forEach((line, i) => ctx.fillText(line, 12, 3 * HT + 15 + i * 16));
  const warn = [...studio.warnings];
  for (const G of [studio, lobbyG, gameG]) G.dispose(); if (old) scene.remove(old.root);
  return { png: out.toDataURL('image/png'), keys, warnings: warn, stats: lobbyG.stats };
}

// ---- the red-eye visibility test (contract 9.3) ----------------------------------------------------------------------
const ID_EYE = new THREE.MeshBasicMaterial({ color: 0xff00ff }), ID_BLACK = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide });
async function idGuest(o, keys, hideFace, omit) {
  const G = await guestFrom({ parts: o.parts, body: o.body, keys, glasses: o.glasses && !(omit || []).includes('Glasses'), rim: null, omit });
  G.root.traverse(m => {
    if (!m.isMesh) return;
    if (m.material.name === 'Eye') m.material = ID_EYE; else if (m.material.name === 'Shine') m.visible = false; else m.material = ID_BLACK;
  });
  if (hideFace) G.merged.visible = false;        // a face's own test: the eyes alone are the reference
  return G;
}
function countId(G, heading, clip, frac) {
  show(G, { yaw: heading }); pose(G, clip, frac);
  G.eyes.computeBoundingBox(); const c = G.eyes.boundingBox.getCenter(new THREE.Vector3()); G.eyes.localToWorld(c);
  const pitch = THREE.MathUtils.degToRad(44), dist = 16;
  cam.clearViewOffset(); cam.fov = 1.4; cam.aspect = 1;
  cam.position.set(c.x, c.y + dist * Math.sin(pitch), c.z + dist * Math.cos(pitch)); cam.lookAt(c); cam.updateProjectionMatrix();
  scene.background = new THREE.Color(0x000000);
  renderer.setSize(512, 512); const rt = new THREE.WebGLRenderTarget(512, 512, { samples: 0 });
  renderer.setRenderTarget(rt); renderer.render(scene, cam); const px = new Uint8Array(512 * 512 * 4);
  renderer.readRenderTargetPixels(rt, 0, 0, 512, 512, px); renderer.setRenderTarget(null); rt.dispose();
  let n = 0; for (let i = 0; i < px.length; i += 4) if (px[i] > 150 && px[i + 1] < 90 && px[i + 2] > 150) n++;
  return n;
}
async function redeye(o) {
  for (const g of Object.values(groups)) g.visible = false;
  const A = await idGuest(o, o.withKeys, false), B = await idGuest(o, o.withoutKeys, !!o.hideFace, o.omitWithout);
  // strict (the contract's words): every view whose reference shows >= 30 ID pixels scores. facing: only the views
  // where the face is turned toward the camera (heading within 90 degrees): from behind (135 / 225) the eye is at
  // most a sliver past the cheek, which today's own guests hide too (reported, not hidden: see the README)
  const views = []; let min = 1, scored = 0, fmin = 1, fscored = 0;
  for (const [clip, frac] of [['Idle', 0], ['Walk', 0.25], ['Walk', 0.75]]) for (let h = 0; h < 360; h += 45) {
    // heading relative to the camera: the camera looks from +z, so a guest turned by h shows that side
    const w = countId(A, h, clip, frac), wo = countId(B, h, clip, frac);
    const ratio = wo >= 30 ? w / wo : null, facing = h <= 90 || h >= 270;
    if (ratio != null) { scored++; min = Math.min(min, ratio); if (facing) { fscored++; fmin = Math.min(fmin, ratio); } }
    views.push({ heading: h, clip, frac, facing, with: w, without: wo, ratio: ratio == null ? null : +ratio.toFixed(3) });
  }
  A.dispose(); B.dispose();
  return { min: +fmin.toFixed(3), scored: fscored, pass: fscored > 0 && fmin >= 0.9,
           strict: { min: +min.toFixed(3), scored, pass: scored > 0 && min >= 0.9 }, views };
}

// ---- the mirror test: a classic man from pieces next to today's shipped model -------------------------------------------
function diffCanvas(a, b) {
  const w = a.width, h = a.height, A = a.getContext('2d').getImageData(0, 0, w, h).data, B = b.getContext('2d').getImageData(0, 0, w, h).data;
  const o = document.createElement('canvas'); o.width = w; o.height = h; const ctx = o.getContext('2d'); const D = ctx.createImageData(w, h);
  let sum = 0, big = 0, fg = 0;
  for (let i = 0; i < A.length; i += 4) {
    const d = (Math.abs(A[i] - B[i]) + Math.abs(A[i + 1] - B[i + 1]) + Math.abs(A[i + 2] - B[i + 2])) / 3;
    const isFg = A[i + 3] > 0 || B[i + 3] > 0;
    sum += d; if (d > 24) big++; fg++;
    const v = Math.min(255, d * 4); D.data[i] = v; D.data[i + 1] = v * 0.4; D.data[i + 2] = 0; D.data[i + 3] = 255;
  }
  ctx.putImageData(D, 0, 0);
  return { c: o, mean: +(sum / fg).toFixed(2), over24: +(100 * big / fg).toFixed(2) };
}
async function mirror(o) {
  const man = await lib(o.parts).manifest();
  const keys = o.keys || resolveKeys(man, o.body, o.worn);
  const eye = (man.parts[`${o.body}/${keys.find(k => k.startsWith('face_'))}`] || {}).eyeCentre;
  const rows = [];      // [label, pieces canvas, shipped canvas]
  const setups = [
    ['game camera, turn 1, warm room', 'warm', GAME_RIM, G => { show(G, { at: [1.0, 0, 0.8] }); pose(G, 'Idle', 0); return tileGame(G, 0); }],
    ['game camera, turn 3, warm room', 'warm', GAME_RIM, G => { show(G, { at: [1.0, 0, 0.8] }); pose(G, 'Idle', 0); return tileGame(G, 2); }],
    ['lobby, wardrobe camera', 'lobby', LOBBY_RIM, G => { show(G); pose(G, 'Idle', 0); look([-0.3, 1.41, 2.4], [0, 0.86, 0], 46); return tileFull(); }],
    ['lobby close-up', 'lobby', LOBBY_RIM, (G, e) => { show(G); pose(G, 'Idle', 0); look(...closeup('head', e)); return tileFull(); }],
    ['walking (Walk 0.25), dark room', 'dark', GAME_RIM, G => { show(G, { at: [1.0, 0, 0.8] }); pose(G, 'Walk', 0.25); return tileGame(G, 0); }],
    ['red eyes, dark room', 'dark', GAME_RIM, G => { show(G, { at: [1.0, 0, 0.8] }); pose(G, 'Idle', 0); G.eyesSwitch.set(true); const t = tileGame(G, 0); G.eyesSwitch.set(false); return t; }],
  ];
  const stats = [];
  const out = document.createElement('canvas'); out.width = 6 * W; out.height = 1600; const ctx = out.getContext('2d');
  ctx.fillStyle = '#0c0908'; ctx.fillRect(0, 0, out.width, out.height);
  for (let j = 0; j < setups.length; j++) {
    const [name, light, rim, fn] = setups[j];
    useLight(light);
    const P = await guestFrom({ parts: o.parts, body: o.body, keys, glasses: o.glasses, rim });
    const S = await shippedFrom(o.shipped, { rim, glasses: o.glasses });
    const a = fn(P, eye), b = fn(S, o.shippedEye || eye);
    const d = diffCanvas(a.c || a, b.c || b);
    stats.push({ view: name, meanDiff: d.mean, pctOver24: d.over24 });
    drawTile(ctx, 0, j, a, `pieces: ${name}`); drawTile(ctx, 1, j, b, `today: ${name}`);
    drawTile(ctx, 2, j, { c: d.c, nearest: !!a.nearest }, `difference x4`, `mean ${d.mean} / 255, ${d.over24} % over 24`);
    P.dispose(); scene.remove(S.root);
  }
  ctx.fillStyle = '#16100d'; ctx.fillRect(0, 3 * HT, out.width, out.height - 3 * HT);
  ctx.fillStyle = '#efe3cc'; ctx.font = '14px Georgia, serif';
  (o.footer || []).forEach((line, i) => ctx.fillText(line, 12, 3 * HT + 15 + i * 16));
  return { png: out.toDataURL('image/png'), keys, stats };
}

// ---- a grid of close-ups (every hair on every face, every top with every neckwear ...): cells [{ label, worn | keys }]
async function grid(o) {
  const cols = o.cols, rows = Math.ceil(o.cells.length / cols), cw = o.cw || 300, ch = o.ch || 340;
  const out = document.createElement('canvas'); out.width = cols * cw; out.height = rows * ch; const ctx = out.getContext('2d');
  ctx.fillStyle = '#0c0908'; ctx.fillRect(0, 0, out.width, out.height);
  const man = await lib(o.parts).manifest(); const warnings = [];
  useLight(o.light || 'lobby');
  for (let i = 0; i < o.cells.length; i++) {
    const cell = o.cells[i], keys = cell.shipped ? [] : (cell.keys || resolveKeys(man, o.body, cell.worn));
    const eye = cell.shipped ? null : (man.parts[`${o.body}/${keys.find(k => k.startsWith('face_'))}`] || {}).eyeCentre;
    const rim = o.light === 'studio' ? null : LOBBY_RIM;
    const G = cell.shipped ? await shippedFrom(cell.shipped, { rim, glasses: !!cell.glasses }) : await guestFrom({ parts: o.parts, body: o.body, keys, glasses: !!cell.glasses, rim });
    if (cell.shipped) G.dispose = () => scene.remove(G.root); else warnings.push(...G.warnings);
    show(G, { yaw: cell.yaw ?? o.yaw ?? 25 }); pose(G, cell.clip || 'Idle', cell.frac || 0);
    const [from, to, fov] = cell.cam || closeup(o.area || 'head', eye); look(from, to, fov, cw / ch);
    const c = renderToCanvas(cw * SS, ch * SS); ctx.drawImage(c, (i % cols) * cw, Math.floor(i / cols) * ch, cw, ch);
    const x = (i % cols) * cw, y = Math.floor(i / cols) * ch;
    ctx.fillStyle = 'rgba(12,9,8,0.75)'; ctx.fillRect(x, y, cw, 22); ctx.fillStyle = '#efe3cc'; ctx.font = '13px Georgia, serif'; ctx.fillText(cell.label, x + 6, y + 15);
    ctx.strokeStyle = '#2a1e18'; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, cw - 2, ch - 2);
    G.dispose();
  }
  return { png: out.toDataURL('image/png'), warnings };
}

window.review = { sheet, redeye, mirror, grid };
window.__ready = true;
